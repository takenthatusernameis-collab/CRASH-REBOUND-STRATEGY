name: Python tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tests.yml"
      - "src/**"
      - "scripts/**"
      - "tests/**"
  push:
    branches:
      - main
      - fix/campaign-integrity-and-exposure-accounting-20261030
    paths:
      - ".github/workflows/tests.yml"
      - "src/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: crash-rebound-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy pandas requests scipy

      - name: Run the complete test suite
        run: python -m pytest -q
